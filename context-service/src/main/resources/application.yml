server:
  port: 8081

onemap:
  base-url: https://www.onemap.gov.sg
  email: ${ONEMAP_EMAIL:}
  password: ${ONEMAP_PASSWORD:}
  walk-speed-m-per-min: ${ONEMAP_WALK_SPEED_M_PER_MIN:80}

places:
  provider: ${PLACES_PROVIDER:catalog}
  max-routed: ${PLACES_MAX_ROUTED:15}

prices:
  provider: ${PRICES_PROVIDER:catalog}

price:
  band-low-max: ${PRICE_BAND_LOW_MAX:10}
  band-mid-max: ${PRICE_BAND_MID_MAX:30}

nea:
  base-url: https://api-open.data.gov.sg/v2/real-time/api
  api-key: ${NEA_API_KEY:}

weather:
  rain-multiplier:
    light: ${WEATHER_RAIN_MULTIPLIER_LIGHT:1.25}
    heavy: ${WEATHER_RAIN_MULTIPLIER_HEAVY:1.4}

ranking:
  walk-weight:
    none: ${RANKING_WALK_WEIGHT_NONE:0.2}
    light: ${RANKING_WALK_WEIGHT_LIGHT:0.5}
    heavy: ${RANKING_WALK_WEIGHT_HEAVY:0.7}
  shelter-bonus: ${RANKING_SHELTER_BONUS:0.20}
  comfort-bonus: ${RANKING_COMFORT_BONUS:0.10}
  sheltered-place-ids: ${RANKING_SHELTERED_PLACE_IDS:sg-001,sg-002,sg-003,sg-004,sg-007,sg-013,sg-022,sg-023,sg-025,sg-030}
  comfort-place-ids: ${RANKING_COMFORT_PLACE_IDS:sg-001,sg-002,sg-003,sg-004,sg-007,sg-013,sg-022,sg-023,sg-025,sg-030}

catalog:
  base-url: ${CATALOG_SERVICE_URL:http://localhost:8083}
  refresh-ms: ${CATALOG_SERVICE_REFRESH_MS:900000}
