# Secrets come from environment variables, or from the repo-root .env when run
# locally (imported below). See .env.example at the repo root.
spring:
  application:
    name: catalog-service
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase's free session pooler allows few clients; three services share it.
      maximum-pool-size: ${DB_POOL_SIZE:3}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    schemas: catalog
    default-schema: catalog
    create-schemas: true

server:
  port: ${CATALOG_SERVICE_PORT:8083}
  forward-headers-strategy: framework

supabase:
  url: ${SUPABASE_URL}
  # Only for projects still on the legacy shared JWT secret (see account-service).
  jwt-secret: ${SUPABASE_JWT_SECRET:}

# Who may manage a venue is decided by account-service (GET /api/me).
account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
