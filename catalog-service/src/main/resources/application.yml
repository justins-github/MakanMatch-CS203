# Secrets come from environment variables, or from the repo-root .env when run
# locally (imported below). See .env.example at the repo root.
spring:
  application:
    name: catalog-service
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase's session pooler allows 25 clients in all, shared by every live
      # deployment and everyone's `npm run dev`. So take at most three, and give
      # back any left unused for 30 s instead of holding all three while idle.
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    schemas: catalog
    default-schema: catalog
    create-schemas: true
  # Menu photos (POST /venues/{id}/menu-scans); the owner's page shrinks big ones first.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${CATALOG_SERVICE_PORT:8083}
  forward-headers-strategy: framework

supabase:
  url: ${SUPABASE_URL}
  # Only for projects still on the legacy shared JWT secret (see account-service).
  jwt-secret: ${SUPABASE_JWT_SECRET:}

# Who may manage a venue is decided by account-service (GET /api/me).
account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
